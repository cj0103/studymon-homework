<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#e5484d">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<script src="/qrcode.min.js"></script>
<title>宝可梦作业激励</title>
<style>
:root { --red:#e3350d; --blue:#3b82f6; --bg:#f5f6fa; }
* { box-sizing:border-box; margin:0; font-family:"PingFang SC","Microsoft YaHei",sans-serif; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); max-width:520px; margin:0 auto; padding-bottom:70px; }
header { background:var(--red); color:#fff; padding:14px 16px; font-size:19px; font-weight:700; position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; }
header small { font-weight:400; opacity:.85; font-size:13px; }
.card { background:#fff; border-radius:14px; margin:12px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
button { border:0; border-radius:10px; padding:11px 16px; font-size:16px; cursor:pointer; }
.btn-p { background:var(--red); color:#fff; width:100%; }
.btn-b { background:var(--blue); color:#fff; }
.btn-g { background:#eef0f4; }
input { width:100%; padding:11px; border:1px solid #ddd; border-radius:10px; font-size:16px; margin:6px 0; }
.tile { display:inline-block; border:2px solid #ddd; border-radius:12px; padding:10px 14px; margin:5px; font-size:16px; background:#fff; }
.tile.on { border-color:var(--red); background:#fff1ed; }
.lv { color:var(--blue); font-weight:700; }
.bar { height:8px; background:#e5e7eb; border-radius:4px; overflow:hidden; margin-top:4px; }
.bar i { display:block; height:100%; background:var(--blue); }
nav { position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; display:flex; background:#fff; border-top:1px solid #eee; }
nav button { flex:1; padding:12px 0; background:none; font-size:14px; color:#666; }
nav button.on { color:var(--red); font-weight:700; }
.tag { font-size:12px; padding:2px 8px; border-radius:9px; background:#eef; color:#35c; }
.stbadge { font-size:12px; padding:2px 8px; border-radius:9px; margin-left:4px; color:#fff; vertical-align:1px; }
.st-poison { background:#a855f7; } .st-para { background:#f59e0b; } .st-sleep { background:#6b7280; }
.st-burn { background:#f97316; } .st-freeze { background:#38bdf8; } .st-confuse { background:#ec4899; }
.warn { color:#b45309; font-size:13px; }
#toast { position:fixed; top:64px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff; padding:8px 18px; border-radius:20px; font-size:14px; display:none; z-index:99; }
/* ---------- v15 对战台面 ---------- */
.bstage { border-radius:14px; overflow:hidden; margin:2px 0 8px; }
.foe-half { background:linear-gradient(#f3ecff,#e4ebf7); padding:10px 12px 6px; }
.my-half { background:linear-gradient(#dcf2dc,#bfe3c0); padding:6px 12px 10px; }
.arena-mid { border-top:2px dashed rgba(90,110,140,.25); }
.unitrow { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
.artwrap { position:relative; width:110px; text-align:center; flex:none; }
.artwrap img { width:96px; height:96px; object-fit:contain; image-rendering:pixelated; filter:drop-shadow(0 3px 4px rgba(0,0,0,.18)); }
.plate { flex:1; background:rgba(255,255,255,.8); border:1px solid rgba(0,0,0,.07); border-radius:10px; padding:7px 10px; }
.hplabel { font-size:11px; color:#667; margin-top:5px; }
.hpline { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; }
.hpbar { height:8px; background:#d8dde5; border-radius:4px; overflow:hidden; margin-top:3px; }
.hpfill { height:100%; background:#2fbf5c; border-radius:4px; transition:width .6s ease; }
.badges { margin-top:5px; min-height:16px; display:flex; gap:4px; flex-wrap:wrap; }
.bb { font-size:11px; padding:1px 7px; border-radius:8px; color:#fff; animation:popin .3s ease; }
.bb-buff { background:#16a34a; } .bb-debuff { background:#dc2626; }
@keyframes popin { 0% { transform:scale(.4); opacity:0 } 70% { transform:scale(1.15) } 100% { transform:scale(1) } }
@keyframes hitflash { 0%,100% { filter:none; transform:translateX(0) } 25% { filter:brightness(1.35) sepia(1) saturate(7) hue-rotate(-32deg); transform:translateX(-6px) } 55% { filter:brightness(1.35) sepia(1) saturate(7) hue-rotate(-32deg); transform:translateX(6px) } 80% { transform:translateX(-3px) } }
@keyframes faintdrop { to { transform:translateY(46px); opacity:0 } }
.artwrap img.hit { animation:hitflash .45s ease 2; }
.artwrap img.fainted { animation:faintdrop .6s ease forwards; }
@keyframes floatup { 0% { opacity:0; transform:translate(-50%,10px) } 15% { opacity:1 } 100% { opacity:0; transform:translate(-50%,-46px) } }
.floaty { position:absolute; left:50%; top:4px; transform:translateX(-50%); font-weight:800; font-size:22px; pointer-events:none; z-index:6; animation:floatup 1s ease forwards; white-space:nowrap; text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff; }
.mvarrow { font-size:13px; font-weight:800; margin-left:2px; }
.mvnoeff { color:#9ca3af; font-size:15px; font-weight:700; margin-left:2px; }
.blog { font-size:14px; color:#555; margin-top:8px; background:#fafbfd; border:1px solid #eef1f5; border-radius:10px; padding:8px 10px; max-height:132px; overflow-y:auto; }
.lg { padding:2px 0; animation:fadein .25s ease; }
@keyframes fadein { from { opacity:0; transform:translateY(5px) } to { opacity:1 } }
.lg-dmg { color:#b91c1c; } .lg-heal { color:#15803d; } .lg-buff { color:#16a34a; } .lg-debuff { color:#b45309; }
.lg-status { color:#7c3aed; } .lg-noeff { color:#6b7280; } .lg-sys { color:#374151; }
</style>
</head>
<body>
<header><span id="h-title">宝可梦作业激励</span><small id="h-sub"></small></header>
<div id="app"></div>
<nav id="nav" style="display:none"></nav>
<div id="toast"></div>
<script>
const S = { token: localStorage.getItem("pkm_token")||"", role: "kid",
            tasks:[], today:null, sel:new Set(), view:"home" };
const $ = s => document.querySelector(s);
const AIL_CN = { poison:"中毒", para:"麻痹", sleep:"睡眠", burn:"烧伤", freeze:"冰冻", confuse:"混乱", tri:"异常" };
const AIL_ICON = { poison:"🟣", para:"⚡", sleep:"💤", burn:"🔥", freeze:"❄️", confuse:"💫", tri:"❓" };
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m, dur){ const t=$("#toast"); t.textContent=m; t.style.display="block"; setTimeout(()=>t.style.display="none", dur||2200); }
async function api(path, opt={}) {
  opt.headers = Object.assign({"Content-Type":"application/json"}, opt.headers||{});
  if (S.token) opt.headers["Authorization"] = "Bearer "+S.token;
  if (opt.body && typeof opt.body !== "string") opt.body = JSON.stringify(opt.body);
  const r = await fetch("/api"+path, opt);
  const j = await r.json().catch(()=>({}));
  if (!r.ok) { toast(j.detail||"请求失败"); throw new Error(j.detail); }
  return j;
}
function setToken(t){ S.token=t; localStorage.setItem("pkm_token",t); }

/* ---------- 桌面快捷链接（带密钥完整链接 + 二维码 + 复制） ---------- */
function entryModal(){
  const dev = localStorage.getItem("pkm_kid") || "";
  if(!dev) return toast("本设备没有登录凭据，请联系家长重新扫码");
  const url = location.origin + "/?k=" + dev;
  let m = document.getElementById("eem");
  if(!m){ m = document.createElement("div"); m.id="eem";
    m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99;display:flex;align-items:center;justify-content:center";
    m.onclick = e=>{ if(e.target===m) m.remove(); };
    document.body.appendChild(m); }
  m.innerHTML = `<div style="background:#fff;border-radius:16px;padding:20px 22px;text-align:center;max-width:88%">
    <b>📌 我的桌面快捷链接</b>
    <div id="ee_qr" style="margin:10px auto 8px"></div>
    <div style="font-size:12px;color:#555;word-break:break-all;background:#f8f8f8;border-radius:8px;padding:8px">${esc(url)}</div>
    <button class="btn-p" style="margin-top:10px;width:100%" onclick="copyEntry('${esc(url)}')">📋 复制完整链接</button>
    <div style="font-size:12px;color:#888;margin-top:8px;line-height:1.8">
      用法①：浏览器菜单 →「添加到主屏幕」，以后点图标直进<br>
      用法②：把链接存为书签或发到别的设备，打开即登录<br>
      用法③：其他设备扫上面的二维码</div></div>`;
  const qr = qrcode(0,"M"); qr.addData(url); qr.make();
  const box = m.querySelector("#ee_qr");
  box.innerHTML = qr.createSvgTag({cellSize:4, margin:2, scalable:true});
  box.querySelector("svg").style.width = "210px";
}
function copyEntry(url){
  const done = ()=>toast("已复制！去浏览器菜单「添加到主屏幕」或存书签");
  if(navigator.clipboard && window.isSecureContext !== false){
    navigator.clipboard.writeText(url).then(done, ()=>fallbackCopy(url,done));
  } else fallbackCopy(url,done);
}
function fallbackCopy(url, done){
  // http 非安全环境下 navigator.clipboard 不可用 → 隐藏 textarea + execCommand 兜底
  const ta = document.createElement("textarea");
  ta.value = url; ta.style.cssText="position:fixed;left:-9999px";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("复制失败，请长按上方链接手动复制"); }
  document.body.removeChild(ta);
}

/* ---------- 首页 ---------- */
async function home(){
  const [tasks, today] = await Promise.all([api("/child/tasks"), api("/child/today")]);
  S.tasks=tasks; S.today=today; S.sel.clear();
  const r = today.record;
  const sealCard = (today.sealed && today.sealed.length) ? `
  <div class="card" style="background:linear-gradient(135deg,#faf5ff,#f3e8ff)">
    <h3>🔮 封印中的伙伴（${today.sealed.length} 只）</h3>
    ${today.sealed.map(s=>`<div style="display:flex;align-items:center;margin:6px 0">
      <img src="/static/artwork/thumb/${s.pokedex_no}.png" width="40" style="filter:grayscale(1);opacity:.75;margin-right:8px" onerror="this.style.display='none'">
      <div style="flex:1"><b style="color:#7c3aed">${esc(s.name)}</b> 等待解封（解锁后 Lv${s.unseal_level}）
      <div class="bar" style="margin-top:3px"><i style="width:${Math.min(100, 100*(s.seal_progress||0)/(today.seal_need||7))}%"></i></div>
      <span style="font-size:12px;color:#888">封印进度 ${s.seal_progress||0}/${today.seal_need||7} 天 · ${esc(s.intro||"")}</span></div></div>`).join("")}
    <div style="margin-top:8px;background:#fff;border-radius:10px;padding:8px 10px;font-size:13px">
      🔮 每只伙伴从<b>获得那天</b>起，连续打卡获批满 ${today.seal_need||7} 天自动激活，<br>
      <span style="font-size:12px;color:#888">激活时达到赠礼道馆的推荐等级；中断则这只重新数（不影响 🔥 大联击）</span></div></div>` : "";
  $("#app").innerHTML = `
  <div class="card"><span style="${today.quick_open?"":"filter:grayscale(1);opacity:.55"}">⚡</span> 今日快手奖励：<b>${today.quick_open?(today.fast_deadline+" 前打卡经验 +20%"):(today.study_day?"今日已过 "+today.fast_deadline:"双休日不参与快手奖励")}</b></div>
  <div class="card">🔥 连续打卡 ${today.streak} 天${today.streak>=6?"（明天有连击大奖！）":""}
    ${today.carry_pending?`<br><span class="warn">📦 有 ${today.carry_pending} 经验明天发放</span>`:""}</div>
  ${!r ? `<div class="card"><h3>今天完成了什么？勾一勾！</h3>
      ${tasks.map(t=>`<span class="tile" data-id="${t.id}" data-name="${esc(t.task_name)}" onclick="tgl(this)">${esc(t.task_name)}</span>`).join("")}
      <br><button class="btn-p" style="margin-top:10px" onclick="submitCK()">提交给家长审核（基础${today.daily_base}经验${today.quick_open?"×1.2":""}）</button></div>`
  : r.status===1 ? `<div class="card">✅ 已提交 ${(r.items||[]).map(i=>esc(i.name)).join("、")}<br><span class="warn">⏳ 等待家长审核中，审核通过就发经验啦…</span>
      <br><button class="btn-g" style="margin-top:8px" onclick="withdrawCK()">撤回</button></div>`
  : `<div class="card">${r.status===4?"❌ 被驳回："+esc(r.reject_reason||""):"🎉 今日经验 <b class='lv'>+"+r.exp_final+"</b>"+(r.penalty?`（-${r.penalty}: ${esc(r.penalty_reason||"")})`:"")+(r.quick_exp?`（含快手+${r.quick_exp}）`:"")+(r.streak_bonus?`（含连击+${r.streak_bonus}）`:"")+(r.carry_to?`，${r.carry_to}顺延明天`:"")}</div>`+evoCard(r.evolved_json)}`
  + sealCard;
}
function tgl(el){ const id=el.dataset.id; if(S.sel.has(id)){S.sel.delete(id);el.classList.remove("on");}else{S.sel.add(id);el.classList.add("on");} }
async function submitCK(){
  if(!S.sel.size) return toast("至少勾选一项");
  const items=[...S.sel].map(id=>{const t=S.tasks.find(t=>t.id==id);return{id:+id,name:t.task_name};});
  await api("/child/checkin",{method:"POST",body:{items}}); toast("已提交，等待家长审核"); home();
}
async function withdrawCK(){ await api("/child/checkin",{method:"DELETE"}); home(); }
function evoCard(j){
  if(!j) return "";
  let arr; try{ arr = JSON.parse(j); }catch(e){ return ""; }
  if(!arr || !arr.length) return "";
  const names = arr.map(esc).join("、");
  return `<div class="card" style="background:linear-gradient(135deg,#fef9c3,#fde68a);border:2px solid #f59e0b;text-align:center">
    <div style="font-size:26px">🎊✨</div>
    <div style="font-weight:800;font-size:18px;color:#b45309;margin:4px 0">你的宝可梦进化了！</div>
    <div style="font-size:15px;color:#92400e">👉 ${names}</div>
    <div style="font-size:12px;color:#a16207;margin-top:4px">快去「我的宝可梦」看看新形态和新招式吧</div></div>`;
}

/* ---------- 宝可梦页 v12：队伍横条 + 紧凑格子 + 编队模式 ----------
   v16：出战队伍=按选择先后（slot 序），不再按等级重排；候补区仍按等级降序 */
const pCell = (p, ob, extra="") => `<div onclick="${ob}" style="position:relative;border:2px solid ${ob.includes("editIn")?"#3b82f6":"#eee"};border-radius:12px;background:#fff;padding:6px 2px 5px;text-align:center;cursor:pointer">
  <img src="/static/artwork/official/${p.pokedex_no}.png" width="46" height="46" style="object-fit:contain;${p.sealed?"filter:grayscale(1);opacity:.6":""}" onerror="this.style.visibility='hidden'">
  <div style="font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden">${esc(p.name)}</div>
  <div style="font-size:10px;color:var(--blue);font-weight:700">Lv${p.level}</div>${extra}</div>`;

async function poke(){
  const [rows, dex] = await Promise.all([api("/child/pokemon"), api("/child/pokedex")]);
  S.pkm = {}; rows.forEach(p=>S.pkm[p.id]=p);
  S.teamIds = rows.filter(p=>p.is_in_team).sort((a,b)=>a.slot-b.slot).map(p=>p.id);
  const seen = dex.filter(d=>d.owned);
  // v16 出战队伍按 slot 升序=选择先后（S.teamIds 已按 slot 排序）
  const team = S.teamIds.map(id=>S.pkm[id]).filter(p=>p&&p.is_in_team);
  const rest = rows.filter(p=>!p.is_in_team).sort((a,b)=>(b.level-a.level)||(a.pokedex_no-b.pokedex_no)||(a.id-b.id));
  $("#app").innerHTML = `
  <div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <h3>我的宝可梦（已收 ${seen.length} 只）</h3>
      ${rows.some(p=>!p.sealed)?`<button class="btn-b" style="padding:7px 14px;font-size:14px" onclick="pokeEdit()">⚔️ 编队</button>`:""}</div>
    <div style="font-size:12px;color:#888;margin-bottom:6px">出战队伍（按选择先后，1 号首发）</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${(team[0]?pCell(team[0],"pokeDetail("+team[0].id+")",`<span style="position:absolute;top:2px;left:4px;font-size:10px;background:var(--red);color:#fff;border-radius:6px;padding:0 5px">1</span>`):"<div style='border:2px dashed #ddd;border-radius:12px;min-height:86px'></div>")}${(team[1]?pCell(team[1],"pokeDetail("+team[1].id+")",`<span style="position:absolute;top:2px;left:4px;font-size:10px;background:var(--red);color:#fff;border-radius:6px;padding:0 5px">2</span>`):"<div style='border:2px dashed #ddd;border-radius:12px;min-height:86px'></div>")}${(team[2]?pCell(team[2],"pokeDetail("+team[2].id+")",`<span style="position:absolute;top:2px;left:4px;font-size:10px;background:var(--red);color:#fff;border-radius:6px;padding:0 5px">3</span>`):"<div style='border:2px dashed #ddd;border-radius:12px;min-height:86px'></div>")}</div></div>
  <div class="card"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px">
    ${rest.map(p=>pCell(p,"pokeDetail("+p.id+")",p.sealed?`<span style="position:absolute;top:2px;right:4px;font-size:11px">🔮</span>`:"")).join("")}</div>
    <small style="color:#888;display:block;margin-top:8px">👆 点一格看详情、配技能；换宝可梦点右上「编队」</small></div>
  <div class="card"><h3>图鉴 ${seen.length}/151（点亮=拥有过，进化后前身也保留）</h3><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px">
      ${dex.map(d=>`<div style="text-align:center;font-size:11px;color:${d.owned?"#333":"#bbb"}">
        ${d.owned
          ? `<img src="/static/artwork/gen1-red-blue/${d.pokedex_no}.png" width="36" onerror="this.style.opacity=.15"><div>${esc(d.name)}</div>`
          : `<div style="width:36px;height:36px;margin:0 auto;display:flex;align-items:center;justify-content:center;background:#eee;border-radius:8px;color:#bbb;font-weight:bold">?</div><div>???</div>`}</div>`).join("")}</div></div>`;
}

/* ---------- 编队模式：点选进出、满员自动换最后上阵、保存才提交 ----------
   v16：队伍顺序=点选先后（1 号=首发=最先选）；保存按选择顺序提交 slot */
async function pokeEdit(){
  const rows = await api("/child/pokemon");
  S.pkm = {}; rows.forEach(p=>S.pkm[p.id]=p);
  S.editTeam = rows.filter(p=>p.is_in_team).sort((a,b)=>a.slot-b.slot).map(p=>p.id);
  pokeEditRender();
}
function pokeEditRender(){
  const rows = Object.values(S.pkm);
  const team = S.editTeam.map(id=>S.pkm[id]).filter(Boolean);
  const inT = new Set(S.editTeam);
  const rest = rows.filter(p=>!inT.has(p.id)&&!p.sealed).sort((a,b)=>(b.level-a.level)||(a.pokedex_no-b.pokedex_no)||(a.id-b.id));
  const slot = (p,i)=> p
    ? `<div onclick="editOut(${i})" style="position:relative;border:2px solid #3b82f6;border-radius:12px;background:#eff6ff;padding:6px 2px 5px;text-align:center;cursor:pointer">
        <img src="/static/artwork/official/${p.pokedex_no}.png" width="46" height="46" style="object-fit:contain" onerror="this.style.visibility='hidden'">
        <div style="font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden">${esc(p.name)}</div>
        <div style="font-size:10px;color:var(--blue);font-weight:700">Lv${p.level}</div>
        <span style="position:absolute;top:2px;left:4px;font-size:10px;background:var(--red);color:#fff;border-radius:6px;padding:0 5px">${i+1}</span>
        <span style="position:absolute;top:1px;right:3px;color:#3b82f6;font-weight:700;font-size:13px">✕</span></div>`
    : `<div style="border:2px dashed #ddd;border-radius:12px;min-height:86px;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:12px">空槽</div>`;
  $("#app").innerHTML = `
    <button class="btn-g" style="margin-bottom:8px" onclick="poke()">‹ 取消返回</button>
    <div class="card"><h3>⚔️ 选择出战队伍</h3>
      <small style="color:#888">点下面的宝可梦加入队伍，<b>先点的排前面（1 号首发）</b>；满 3 只时自动换下最后面的；点队伍里的 ✕ 移出。<b>点「保存」才会生效</b>。</small>

/* 技能副文本：攻击招显示 属性·威力·命中（带附加异常补彩色标签）；变化招显示 效果·对象·档位 */
function ailTag(m){
  if(!m.ailment) return "";
  const nm = AIL_CN[m.ailment]||m.ailment;
  const pct = m.ailment_chance<100 ? " "+m.ailment_chance+"%" : "";
  const col = {poison:"#a855f7",para:"#f59e0b",sleep:"#6b7280",burn:"#f97316",freeze:"#38bdf8",confuse:"#ec4899",tri:"#8b5cf6"}[m.ailment]||"#888";
  return ` <span style="color:${col};font-weight:600">${AIL_ICON[m.ailment]||""} ${nm}${pct}</span>`;
}
function moveSub(m){
  if(m.power>0) return esc(m.skill_type)+"·威力"+m.power+"·命中"+(m.accuracy||100)+"%"+ailTag(m);
  const v = m.effect_value, et = m.effect_type||"";
  if(!et) return "变化招式";
  if(et.startsWith("status_")) return `<span style="color:#dc2626">使对方${AIL_CN[m.ailment]||""}</span>`+(m.accuracy?"·命中"+m.accuracy+"%":"");
  if(et==="heal") return "<span style='color:#16a34a'>回复自身HP "+Math.round((v||0.5)*100)+"%</span>";
  if(et==="drain") return "<span style='color:#16a34a'>吸血·伤害并回复</span>";
  if(et==="ohko") return "<span style='color:#dc2626'>强力招·命中后对方只剩1点体力</span>";
  const up = et.endsWith("_up"), stat = et.startsWith("atk")?"攻击":"防御";
  const strong = up ? v>=2 : v<=0.5;   // 1.5→单档 2→双档；0.7→单档 0.5→双档
  const arrow = (up?"↑":"↓").repeat(strong?2:1);
  const hit = m.accuracy? "·命中"+m.accuracy+"%" : "";
  return (up?"<span style='color:#16a34a'>增益·自身"+stat+arrow+"</span>"
             :"<span style='color:#dc2626'>减益·对方"+stat+arrow+"</span>")+"·整场有效"+hit;
}
function tglMove(mid){
  const cur = S.detailSel;
  if(cur.has(mid)) cur.delete(mid);
  else { if(cur.size>=4) return toast("最多带4个技能，先取消一个再选"); cur.add(mid); }
  if(cur.size===0){ cur.add(mid); return toast("至少保留1个上场技能（战斗中至少要有一招）"); }

  pokeDetail(S.detail.id, true);
}

// 招式对某对手的效果箭头：▲红单 / ▲▲红双 / ▼绿单 / ▼▼绿双 / ⊘灰大叉（不禁用按钮）
const effMark = r => { if(r===null||r===undefined) return "";
  if(r===0) return `<span class="mvnoeff" title="这个属性对它不起作用">⊘</span>`;
  if(r>=4) return `<span class="mvarrow" style="color:#e3350d">▲▲</span>`;

  if(r<1) return `<span class="mvarrow" style="color:#16a34a">▼</span>`;
  return ""; };
// 台词旁白分类着色（按整句判定，避免"对方"的"方"字误触发）
function logCls(l){
  if(/效果拔群/.test(l)) return "lg-dmg";
  if(/没有效果|没有命中|弹开|无法动弹|呼呼大睡|被冻住|打到自己|效果不太好/.test(l)) return "lg-noeff";
  if(/恢复了.*体力|吸取/.test(l)) return "lg-heal";
  if(/提升/.test(l)) return "lg-buff";
  if(/下降/.test(l)) return "lg-debuff";
  if(/了！|中毒|麻痹|灼伤|冰冻|混乱|醒过来|融化|理智/.test(l)) return "lg-status";
  if(/造成|伤害|倒下|倒戈/.test(l)) return "lg-dmg";
  return "lg-sys";
}
// 从台词解析飘字事件与受击方：出手方主语（"对方的X 使用…"→我方挨打）；默认受击方=对方（旁白误判安全）
function eventOf(l){
  const foeActor = /^对方的/.test(l);
  let who = foeActor ? "me" : "foe", v=null, kind=null;
  if(/精灵球弹开|没有命中/.test(l)) kind="miss";
  else if(/打到自己/.test(l)){ who=foeActor?"foe":"me"; kind="self"; v=1; }
  const mh=l.match(/使用 \S+，恢复了 (\d+) 点体力/);
  const mc=l.match(/造成 (\d+) 伤害/);
  const mz=l.match(/因中毒受到 (\d+) 伤害/);
  if(mz){ kind="dmg"; who=foeActor?"foe":"me"; v=+mz[1]; }   // 毒伤落在被描述方自己身上
  else if(mc){ kind="dmg"; v=+mc[1]; }
  else if(mh){ kind="heal"; who=foeActor?"foe":"me"; v=+mh[1]; }  // 回复落在出手方自己身上
  return {kind, who, v};
}
function buffBadges(u){
  const b = (BS.buffs||{})[u.ref];
  if(b==null || Math.abs(b-1)<1e-9) return "";
  const t = b>1 ? `攻↑×${(+b.toFixed(2)).toString().replace(/\.?0+$/,"")}` : `攻↓×${(+b.toFixed(2)).toString().replace(/\.?0+$/,"")}`;
  return `<span class="bb ${b>1?"bb-buff":"bb-debuff"}">${t}</span>`;
}

function renderMoves(){

  const rateOf = mid => { const e=(BS.moves_effect||[]).find(x=>x.id===mid); return e?e.rate:null; };
  $("#mvrow").innerHTML = `${(m.moves||[]).map(mv=>{const pp=m.pp?m.pp[mv.id]:null,out=pp===0;
    return `<button class="btn-g" style="margin:3px${out?";opacity:.35":""}" ${out?"disabled":""} onclick="useSkill(${mv.id})">${esc(mv.skill_name)}${effMark(mv.power>0?rateOf(mv.id):null)}${mv.priority>0?'<small style="color:#c9a227">⚡先制</small>':""}<small style="color:#888">${mv.power>0?" 威力"+mv.power+"·命中"+(mv.accuracy||100)+"%":" 变化"}${mv.ailment&&mv.ailment_chance? "·"+(AIL_CN[mv.ailment]||mv.ailment)+(mv.ailment_chance<100? " "+mv.ailment_chance+"%":""):""}${pp!=null? "·PP"+"●".repeat(Math.min(pp,8))+"○".repeat(Math.max(0,Math.min(8,(mv.max_pp||8)-pp)))+(pp===0?"(用完了)":""):""}</small></button>`}).join("")}
    ${BS.kindWild?`<button class="btn-b" style="margin:3px" onclick="tryCatch()">🔴 丢精灵球</button>`:""}
    <button class="btn-g" style="margin:3px" onclick="flee()">逃跑</button>`;
}

/* --- 逐回合演出：0.8s/条，文字旁白与血条/飘字动画同拍 --- */
let PLAYING=false, LOGOPEN=true;
function floatTxt(side,txt,color){
  const w=$("#art-"+side); if(!w||txt==null) return;
  const s=document.createElement("span"); s.className="floaty"; s.textContent=txt; s.style.color=color;
  w.appendChild(s); setTimeout(()=>s.remove(),1100);
}
function hpColor(p){ return p>0.5?"#2fbf5c":p>0.2?"#f59e0b":"#e3350d"; }
function applyOne(l){
  const e=eventOf(l);
  if(e.kind==="miss"){ floatTxt(e.who,"✗","#9ca3af"); }
  else if(e.kind==="heal"){ floatTxt(e.who,"+"+e.v,"#15803d"); }
  else if(e.kind==="dmg"||e.kind==="self"){
    const img=$("#img-"+e.who); if(img){ img.classList.remove("hit"); void img.offsetWidth; img.classList.add("hit"); }
    floatTxt(e.who,"-"+e.v,"#dc2626");
  }
  refreshHpBars();
  const bl=$("#blog");
  if(bl){ bl.insertAdjacentHTML("beforeend",`<div class="lg ${logCls(l)}">${esc(l)}</div>`); bl.scrollTop=bl.scrollHeight; }
}
function refreshHpBars(){
  const f=BS.foe[BS.foe_idx||0]||BS.foe[0], m=BS.my[BS.my_idx||0]||BS.my[0];
  [["foe",f],["me",m]].forEach(([side,u])=>{
    const bar=$("#hp-"+side); if(!bar||!u) return;
    const hp=Math.max(0,u.hp), pct=100*hp/u.stats.hp;
    bar.style.width=pct+"%"; bar.style.background=hpColor(pct/100);
    const lbl=bar.parentElement.querySelector(".hplabel");
    if(lbl) lbl.textContent=`HP ${hp}/${u.stats.hp}`;
    if(hp<=0){ const img=$("#img-"+side); if(img&&!img.classList.contains("fainted")) img.classList.add("fainted"); }
  });
  (BS.my||[]).filter(x=>x!==(BS.my[BS.my_idx||0])).forEach((x,i)=>{ const b=$("#rstbar"+i); if(b){ b.style.width=(100*Math.max(0,x.hp)/x.stats.hp)+"%"; b.style.background=hpColor(Math.max(0,x.hp)/x.stats.hp); } });
}
function animateMsgs(msgs,done){
  const q=[...(msgs||[])];
  const step=()=>{
    if(!q.length){ done&&done(); return; }
    if(!LOGOPEN){  // 折叠态：跳过演出直接落账
      (BS.history=BS.history||[]).push(...q); q.length=0; refreshHpBars();
      const bl=$("#blog"); if(bl){ bl.innerHTML=(BS.history||[]).slice(-14).map(l=>`<div class="lg ${logCls(l)}">${esc(l)}</div>`).join(""); }
      done&&done(); return;
    }
    const l=q.shift();
    (BS.history=BS.history||[]).push(l);
    applyOne(l);
    setTimeout(step,800);
  };
  step();
}
function toggleLog(){ LOGOPEN=!LOGOPEN; const bl=$("#blog"); if(bl) bl.style.display=LOGOPEN?"":"none"; renderArena(); }
async function useSkill(id){ if(PLAYING) return; PLAYING=true; renderMoves();
  try{ const r=await api("/child/battle/act",{method:"POST",body:{action:"attack",skill_id:id}}); afterAct(r); }
  finally{ if(PLAYING && !BS){ PLAYING=false; } } }
async function tryCatch(){ if(PLAYING) return; PLAYING=true; renderMoves();
  try{ const r=await api("/child/battle/act",{method:"POST",body:{action:"catch"}}); afterAct(r); }
  finally{ if(PLAYING && !BS){ PLAYING=false; } } }
async function flee(){ await api("/child/battle/act",{method:"POST",body:{action:"run"}}); toast("成功逃脱"); BS=null; battle(); }
function afterAct(r){
  const finish=()=>{ PLAYING=false; };
  const over=(msg,dur)=>{ setTimeout(()=>{ toast(msg,dur||2600); BS=null; battle(); },900); };
  if(r.result==="win"){
    Object.assign(BS,{my:r.my,foe:r.foe,buffs:r.buffs||{},my_idx:r.my_idx,foe_idx:r.foe_idx});
    refreshHpBars();
    animateMsgs(r.messages,()=>{
      if(r.gift) toast(`🎁 获得道馆礼物：${r.gift.name}（封印中）！连续打卡7天即可激活！`,4200);
      else toast("🎉 胜利！"+(r.badge?"获得徽章【"+r.badge+"】":""),3200);
      BS=null; battle(); PLAYING=false;
    });
    return;
  }
  if(r.result==="lose"){
    Object.assign(BS,{my:r.my,foe:r.foe,buffs:r.buffs||{},my_idx:r.my_idx,foe_idx:r.foe_idx});
    refreshHpBars();
    animateMsgs(r.messages,()=>{ toast("被打倒了…回去练级吧"); BS=null; battle(); PLAYING=false; });
    return;
  }
  if(r.result==="catch"){
    animateMsgs(r.messages&&r.messages.length?r.messages:[""],()=>{
      toast("🎊 捕获成功！"); BS=null; battle(); PLAYING=false;
    });
    return;
  }
  // continue：先更新数据再演出（血条动画靠新旧 width 差收敛，paint 前保留旧 DOM）
  BS.my=r.my; BS.foe=r.foe; BS.buffs=r.buffs||{}; BS.my_idx=r.my_idx; BS.foe_idx=r.foe_idx;
  BS.moves_effect=r.moves_effect;
  renderArena();       // 换人/新对手重画台面
  renderMoves();       // 按钮恢复可点
  animateMsgs(r.messages,finish);
}

/* ---------- 导航 ---------- */
const VIEWS = { home, poke, battle };
async function go(v){
  S.view=v;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  try{ await VIEWS[v](); }
  catch(e){   // 真·网络/渲染异常兜底：不留白，给重试入口（措辞中性，避免孩子误以为出错）
    $("#app").innerHTML = `<div class="card">😴 页面没有打开，网络可能不稳定<br><br>
      <button class="btn-p" onclick="go('${v}')">点击重试</button></div>`;
  }
}

/* ---------- 启动：?k= 令牌 → 本地缓存令牌 → 绑定页 ---------- */
async function enter(name){
  $("#h-sub").innerHTML = esc(name)+' <span onclick="entryModal()" style="cursor:pointer;opacity:.85;margin-left:6px" title="生成桌面快捷链接">🔗</span>';
  const n=$("#nav"); n.style.display="flex";
  n.innerHTML = [["home","🏠 打卡"],["poke","📔 宝可梦"],["battle","⚔️ 冒险"]]
    .map(([k,l])=>`<button data-v="${k}" onclick="go('${k}')">${l}</button>`).join("")
    + `<button onclick="location.href='/guide'">🗺️ 指南</button>`;
  go("home");
}
function renderBind(msg){
  $("#nav").style.display="none";
  $("#app").innerHTML = `<div class="card"><h3>🎫 需要设备链接</h3>
    <p style="font-size:14px;color:#666;line-height:1.8">${msg||"请让家长在管理页签发「孩子平板」链接，<br>或用该链接打开本页面。"}</p>
    <input id="k" placeholder="粘贴 kid_ 开头的设备令牌" style="font-size:14px">
    <button class="btn-p" onclick="bindK()">绑定</button></div>`;
}
async function bindK(){
  const k = $("#k").value.trim();
  if(!k) return;
  try{ const j = await api("/resolve/"+encodeURIComponent(k));
    if(j.role!=="kid") return toast("这是家长链接");
    setToken(j.token); enter(j.name);
  }catch(e){}
}
(async ()=>{
  const q = new URLSearchParams(location.search);
  let k = q.get("k");
  if (k) { history.replaceState(null,"",location.pathname); localStorage.setItem("pkm_kid",k); }
  else k = localStorage.getItem("pkm_kid");
  if (!k) return renderBind();
  try{
    const j = await api("/resolve/"+encodeURIComponent(k));
    if (j.role!=="kid") return renderBind("这是家长链接，请在家长设备使用");
    setToken(j.token); enter(j.name);
  }catch(e){ renderBind("设备链接已失效，请联系家长重新签发。"); }
})();
</script>
